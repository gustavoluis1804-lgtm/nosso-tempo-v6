name: Gerar APK - Nosso Tempo V4 Foto e Cor

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Mostrar versões
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Criando Android..."
            npx cap add android
          else
            echo "Android já existe."
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Aplicar Nosso Tempo V4
        run: node scripts/patch-android.mjs

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Mostrar versão do Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Limpar projeto
        working-directory: android
        run: ./gradlew clean

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verificar APK gerado
        run: |
          echo "APK gerado:"
          ls -lah android/app/build/outputs/apk/debug/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nosso-Tempo-V4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
